name: Relay
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.12.6
targets:
  Relay:
    type: application
    platform: macOS
    sources:
      - path: Relay
        excludes:
          - Relay.xcodeproj
          - "**/*.xcworkspace"
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.relaymac.Relay
        PRODUCT_NAME: Relay
        SWIFT_VERSION: 6.0
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Relay Local Development"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Relay uses the microphone only while you dictate."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Relay uses on-device speech recognition when the Apple Speech backend is selected."
  RelayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RelayTests
    dependencies:
      - target: Relay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Relay:
    build:
      targets:
        Relay: all
        RelayTests: [test]
    test:
      targets:
        - RelayTests
