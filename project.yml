name: Relay
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.7
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0
targets:
  Relay:
    type: application
    platform: macOS
    sources:
      - path: Relay
        excludes:
          - Info.plist
      - path: Shared
      - path: RelayHook/HookTransportClient.swift
        group: RelayHook
      - path: RelayHook/BoundedStdinReader.swift
        group: RelayHook
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: WhisperKit
        product: WhisperKit
      - target: RelayHook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.relaymac.Relay
        PRODUCT_NAME: Relay
        SWIFT_VERSION: 6.0
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Relay Local Development"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Relay/Info.plist
        RELAY_BUILD_FLAVOR: release
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Relay uses the microphone only while you dictate."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Relay uses on-device speech recognition when the Apple Speech backend is selected."
      configs:
        debug:
          # Debug is a separate app ("Relay Debug") with its own TCC grants, settings, socket and
          # helper. Stable signing (below) keeps its grants across rebuilds.
          PRODUCT_BUNDLE_IDENTIFIER: dev.relaymac.Relay.debug
          INFOPLIST_KEY_CFBundleDisplayName: "Relay Debug"
          RELAY_BUILD_FLAVOR: debug
    postbuildScripts:
      - name: Embed RelayHook
        script: |
          set -euo pipefail
          helper_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          mkdir -p "${helper_dir}"
          cp "${BUILT_PRODUCTS_DIR}/RelayHook" "${helper_dir}/RelayHook"
          chmod 755 "${helper_dir}/RelayHook"
        basedOnDependencyAnalysis: false
  RelayHook:
    type: tool
    platform: macOS
    sources:
      - path: RelayHook
      - path: Relay/Integrations/Domain/HookEnvelope.swift
      - path: Relay/Integrations/Domain/AgentProvider.swift
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: RelayHook
        SWIFT_VERSION: 6.0
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        # Sign the embedded helper with the same stable cert as the app (not ad-hoc "-"), so its
        # cdhash-pinned identity does not churn the app bundle's seal on every rebuild.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Relay Local Development"
  RelayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RelayTests
    dependencies:
      - target: Relay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Relay:
    build:
      targets:
        Relay: all
        RelayTests: [test]
    test:
      targets:
        - RelayTests
